html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: #FFE5EC;
}

body {
	position: fixed;
	inset: 0;
	color: #5a3a48;
	touch-action: none;
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	font-family: -apple-system, 'Segoe UI', 'Noto Sans', Arial, sans-serif;
}

#canvas {
	display: block;
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #FFE5EC;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 12%;
	width: 50%;
	height: 14px;
	margin: 0 auto;
	accent-color: #FF6B9D;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#a2hs {
	display: none;
	position: absolute;
	left: 50%;
	transform: translateX(-50%);
	bottom: calc(3% + env(safe-area-inset-bottom));
	background: rgba(255, 255, 255, 0.9);
	border-radius: 14px;
	padding: 8px 14px;
	font-size: 14px;
	color: #6b3a52;
	box-shadow: 0 2px 8px rgba(0,0,0,0.12);
	white-space: nowrap;
}

#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 20;
	background: rgba(255, 229, 236, 0.92);
	align-items: center;
	justify-content: center;
	flex-direction: column;
}
#rotate svg {
	width: 38vw;
	max-width: 180px;
	animation: turn 2.2s ease-in-out infinite;
}
#rotate .x {
	margin-top: 5vh;
	font-size: 15px;
	color: #9a6278;
	opacity: 0.8;
}
@keyframes turn {
	0%, 20% { transform: rotate(0deg); }
	55%, 80% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}
@media (orientation: portrait) and (pointer: coarse) {
	body.rotate-on #rotate { display: flex; }
}
#safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding-left: env(safe-area-inset-left);
	padding-top: env(safe-area-inset-top);
	padding-right: env(safe-area-inset-right);
	padding-bottom: env(safe-area-inset-bottom);
}

		<script>
// ---- v0.3.2 phone helpers (fullscreen, orientation lock, safe areas) ----
(function () {
	const docEl = document.documentElement;
	// Home-screen app (iOS standalone / installed PWA). Note: "display-mode: fullscreen" also
	// matches while the Fullscreen API is active, so it is deliberately not used here.
	const isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
		window.navigator.standalone === true;
	const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
	const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
		(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	const fsEnabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

	function isFullscreen() {
		return !!(document.fullscreenElement || document.webkitFullscreenElement);
	}
	function lockLandscape() {
		try {
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		} catch (e) { /* not supported */ }
	}
	function enterFullscreen() {
		if (!fsEnabled || isFullscreen()) { lockLandscape(); return; }
		let p = null;
		try {
			if (docEl.requestFullscreen) {
				p = docEl.requestFullscreen({ navigationUI: 'hide' });
			} else if (docEl.webkitRequestFullscreen) {
				p = docEl.webkitRequestFullscreen();
			}
		} catch (e) { p = null; }
		if (p && p.then) {
			p.then(lockLandscape).catch(function () {});
		} else {
			lockLandscape();
		}
	}
	function exitFullscreen() {
		try {
			if (document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
			else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
		} catch (e) { /* ignore */ }
	}

	// First tap on a touch device: go full screen + lock landscape (Android Chrome).
	// iOS Safari has no element fullscreen on iPhone -> Add to Home Screen instead.
	let firstTapDone = false;
	function onFirstTap() {
		if (firstTapDone) { return; }
		firstTapDone = true;
		if (coarse && !isStandalone) { enterFullscreen(); } else if (coarse) { lockLandscape(); }
	}
	document.addEventListener('touchend', onFirstTap, { capture: true, passive: true });
	document.addEventListener('click', onFirstTap, { capture: true, passive: true });

	// No pinch / double-tap zoom or rubber-band scrolling.
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
	document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
	document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) { e.preventDefault(); } }, { passive: false });

	// Rotate hint: tap to dismiss for this session.
	const rot = document.getElementById('rotate');
	rot.addEventListener('click', function () { document.body.classList.remove('rotate-on'); });

	if (isIOS && !isStandalone) {
		document.getElementById('a2hs').style.display = 'block';
	}

	function safeArea() {
		const cs = getComputedStyle(document.getElementById('safe-probe'));
		const v = function (k) { return parseFloat(cs[k]) || 0; };
		return [v('paddingLeft'), v('paddingTop'), v('paddingRight'), v('paddingBottom'),
			window.innerWidth, window.innerHeight].join(',');
	}

	// Bridge for Godot (JavaScriptBridge.eval)
	window.catParty = {
		safeArea: safeArea,
		canFullscreen: function () { return fsEnabled && !isStandalone; },
		isFullscreen: isFullscreen,
		toggleFullscreen: function () { if (isFullscreen()) { exitFullscreen(); } else { enterFullscreen(); } },
		isStandalone: function () { return isStandalone; },
		isIOS: function () { return isIOS; },
	};
}());
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":5910928,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
